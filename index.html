<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<link rel="manifest" href="manifest-menu.json">

<style>
:root{
--ink:#14110D; --ink-soft:#1C1712; --ink-softer:#241E17;
--paper:#F4EFE4; --paper-dim:#C9C2B4;
--rust:#C6703C; --teal:#1F9E8C; --gold:#E8B93D; --bad:#D9534F;
--slate:#9A9184; --line:rgba(244,239,228,0.10); --radius:18px;
--mono:'JetBrains Mono',ui-monospace,monospace;
--sans:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{ background:var(--ink); color:var(--paper); font-family:var(--sans); -webkit-font-smoothing:antialiased; min-height:100vh; transition:background .3s, color .3s; }
a{color:inherit;} button{font:inherit; cursor:pointer;}
h1,h2{font-family:var(--mono); font-weight:800;}

header{ position:sticky; top:0; z-index:20; background:rgba(20,17,13,.92); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); padding:16px 20px; display:flex; align-items:center; justify-content:space-between; }
.brand{ display:flex; align-items:center; gap:8px; font-family:var(--mono); font-weight:800; font-size:14px; color:var(--slate); }
.brand svg{ width:20px; height:20px; }
.edit-toggle{
display:flex; align-items:center; gap:6px; font-family:var(--mono); font-size:12px; font-weight:700;
padding:8px 14px; border-radius:20px; border:1px solid var(--line); background:var(--ink-soft); color:var(--paper-dim);
}
.edit-toggle.on{ background:var(--gold); border-color:var(--gold); color:var(--ink); }
.edit-toggle svg{ width:14px; height:14px; }

.offline-banner{
display:none; background:var(--bad); color:#fff; text-align:center; font-family:var(--mono);
font-size:12.5px; font-weight:700; padding:9px 16px;
}
.offline-banner.show{ display:block; }

main{ max-width:560px; margin:0 auto; padding:22px 20px 70px; }
.menu-title{ text-align:center; margin-bottom:2px; font-size:26px; }
.menu-logo{ display:block; max-width:230px; width:100%; height:auto; margin:0 auto; }
.menu-sub{ text-align:center; color:var(--slate); font-size:13px; font-family:var(--mono); margin-bottom:20px; }

.carta-seccion{ margin-bottom:34px; }
/* Estas dos cajas (Menú del día y el título de las cartas normales) usan un
color fijo, un poco más claro que el original (#1C1712), en vez de adaptarse
al fondo del tema — así siempre se ven igual, como antes, y el texto de
dentro (fijo también, en crema claro) nunca se vuelve ilegible pase lo que
pase con el color de fondo o de texto que elija el local. */
.carta-seccion-title{
display:inline-block; font-family:var(--mono); font-weight:800; font-size:17px; letter-spacing:.04em;
text-transform:uppercase; color:var(--gold); background:#28221c; border:1px solid var(--gold);
border-radius:12px; padding:10px 20px; margin-bottom:14px;
}

.menu-fijo-header{ background:#28221c; border:1px solid var(--gold); border-radius:16px; padding:16px 18px; margin-bottom:16px; text-align:center; }
.menu-fijo-nombre{ font-family:var(--mono); font-size:15px; color:var(--gold); text-transform:uppercase; letter-spacing:.04em; }
.menu-fijo-precio{ font-family:var(--mono); font-weight:800; font-size:26px; margin:4px 0; color:#F7F2E7; }
.menu-fijo-nota{ font-size:11.5px; color:var(--slate); }

.cat-title{ font-family:var(--mono); font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--rust); margin:22px 0 10px; }
.cat-title:first-child{ margin-top:0; }

.plato{ display:flex; justify-content:space-between; gap:14px; padding:13px 4px; border-bottom:1px solid var(--line); }
.plato.no-disp{ opacity:.45; }
.plato-info{ min-width:0; }
.plato-nombre{ font-weight:700; font-size:15.5px; display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
.plato-desc{ font-size:13px; color:var(--paper-dim); margin-top:3px; line-height:1.4; }
.plato-tag{ font-family:var(--mono); font-size:9px; color:var(--bad); border:1px solid var(--bad); padding:2px 6px; border-radius:8px; }
.etiqueta-badge{ font-size:12px; }
.plato-precio{ font-family:var(--mono); font-weight:700; font-size:15px; white-space:nowrap; flex-shrink:0; }
.plato-edit-btns{ display:flex; gap:6px; flex-shrink:0; }
.icon-btn{ width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; color:var(--slate); background:var(--ink-soft); border:1px solid var(--line); flex-shrink:0; }
.icon-btn svg{ width:14px; height:14px; }
.icon-btn.danger:active{ color:var(--bad); border-color:var(--bad); }

.empty{ text-align:center; padding:50px 20px; color:var(--slate); font-size:14px; }

.add-plato-btn{
width:100%; margin-top:20px; padding:14px; border-radius:14px; border:1.5px dashed var(--gold);
background:var(--ink-soft); color:var(--gold); font-weight:700; font-size:14px; display:none;
}
.add-plato-btn.show{ display:block; }

.edit-toolbar{ display:none; gap:8px; margin-bottom:18px; }
.edit-toolbar.show{ display:flex; }
.edit-toolbar button{
flex:1; font-family:var(--mono); font-size:11.5px; font-weight:700; padding:10px; border-radius:12px;
border:1px solid var(--line); background:var(--ink-soft); color:var(--paper-dim);
}

.cartas-panel{ display:none; margin-bottom:22px; }
.cartas-panel.show{ display:block; }
.cartas-row{ display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:10px; }
.carta-chip{
flex-shrink:0; font-family:var(--mono); font-size:12.5px; font-weight:600; padding:9px 14px;
border-radius:20px; border:1.5px solid var(--line); background:var(--ink-soft); color:var(--paper-dim);
display:flex; align-items:center; gap:6px; white-space:nowrap;
}
.carta-chip.viendo{ border-color:var(--gold); color:var(--paper); }
.carta-chip .dot-activa{ width:6px; height:6px; border-radius:50%; background:var(--teal); }
.carta-chip .ico-extra{ opacity:.7; font-size:11px; }
.carta-chip.nueva{ color:var(--gold); border-style:dashed; }
.carta-bar{
display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
background:var(--ink-softer); border-radius:12px; padding:10px 14px; margin-bottom:6px; font-size:12.5px; color:var(--paper-dim);
}
.btn-toggle-carta{ font-family:var(--mono); font-size:11.5px; font-weight:700; padding:8px 13px; border-radius:20px; border:none; }
.btn-toggle-carta.mostrar{ color:var(--ink); background:var(--teal); }
.btn-toggle-carta.ocultar{ color:var(--paper-dim); background:var(--ink-soft); border:1px solid var(--line); }
.btn-gestionar-carta{ font-family:var(--mono); font-size:11px; color:var(--slate); text-decoration:underline; background:none; border:none; }

.modal-overlay{ position:fixed; inset:0; background:rgba(20,17,13,.85); backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center; z-index:100; padding:24px; }
.modal-box{ background:var(--ink-soft); border:1px solid var(--line); border-radius:20px; padding:26px; max-width:380px; width:100%; max-height:86vh; overflow-y:auto; }
.modal-box h3{ font-size:17px; margin-bottom:8px; }
.modal-box p{ font-size:13.5px; color:var(--paper-dim); margin-bottom:18px; line-height:1.5; }
.field{ margin-bottom:14px; }
.field label{ display:block; font-family:var(--mono); font-size:11px; color:var(--slate); text-transform:uppercase; letter-spacing:.05em; margin-bottom:7px; }
.field input, .field textarea{
width:100%; background:var(--ink); border:1px solid var(--line); border-radius:10px;
padding:12px 13px; color:var(--paper); font-family:var(--sans); font-size:15px;
}
.field input[type=color]{ padding:4px; height:46px; }
.field textarea{ min-height:60px; resize:vertical; }
.field-row{ display:flex; gap:10px; }
.field-row .field{ flex:1; }
.checkbox-row{ display:flex; align-items:center; gap:9px; margin-bottom:12px; font-size:14px; }
.etiquetas-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:16px; }
.etiqueta-check{ display:flex; align-items:center; gap:8px; font-size:13px; background:var(--ink); border:1px solid var(--line); border-radius:10px; padding:9px 11px; }
.dias-grid{ display:flex; gap:5px; margin-bottom:14px; }
.dia-toggle{
flex:1; text-align:center; padding:9px 0; border-radius:8px; border:1px solid var(--line);
background:var(--ink); color:var(--paper-dim); font-family:var(--mono); font-size:11.5px; font-weight:700;
}
.dia-toggle.on{ background:var(--gold); border-color:var(--gold); color:var(--ink); }
.tipo-selector{ display:flex; gap:8px; margin-bottom:14px; }
.tipo-opt{ flex:1; padding:12px 8px; border-radius:10px; border:1.5px solid var(--line); background:var(--ink); color:var(--paper-dim); font-size:12.5px; font-weight:600; }
.tipo-opt.on{ border-color:var(--rust); background:rgba(198,112,60,0.12); color:var(--paper); }
.preset-row{ display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
.preset-swatch{ width:52px; height:52px; border-radius:12px; border:2px solid var(--line); flex-shrink:0; }
.preset-swatch.sel{ border-color:var(--gold); }
.btn{ width:100%; padding:14px; border-radius:12px; font-weight:700; font-size:14.5px; border:none; margin-top:4px; }
.btn-primary{ background:var(--rust); color:var(--paper); }
.btn-ghost{ background:none; border:1px solid var(--line); color:var(--paper-dim); margin-top:8px; }
.btn-danger{ background:none; border:1px solid var(--bad); color:var(--bad); margin-top:8px; }
.pin-input{
width:100%; text-align:center; font-size:28px; letter-spacing:14px; font-family:var(--mono);
background:var(--ink); border:1px solid var(--line); border-radius:12px; padding:14px; color:var(--paper);
}

/* Pantalla de bienvenida: se ve un instante nada más abrir el enlace (NFC/QR),
reproduciendo el vídeo de animación del logo, y luego se desvanece para dejar
ver el menú. Se queda un mínimo de tiempo en pantalla (ver JS), a la medida
del vídeo, aunque los datos carguen muy rápido. */
#splash{
position:fixed; inset:0; z-index:300; display:flex; align-items:center; justify-content:center;
background:var(--ink); transition:opacity .5s ease, visibility .5s ease;
}
#splash.hide{ opacity:0; visibility:hidden; pointer-events:none; }
#splashVideo{ width:min(78vw, 420px); height:auto; max-height:70vh; object-fit:contain; }
body.splash-lock{ overflow:hidden; }
</style>
</head>
<body>

<div id="splash">
<video id="splashVideo" src="animacionsinmas.mp4" autoplay muted playsinline></video>
</div>

<header>
<div class="brand">
<svg viewBox="0 0 400 400"><rect width="400" height="400" rx="72" fill="#14110D"/><line x1="108" y1="108" x2="292" y2="292" stroke="#C6703C" stroke-width="42" stroke-linecap="round"/><line x1="292" y1="108" x2="108" y2="292" stroke="#C6703C" stroke-width="42" stroke-linecap="round"/><circle cx="108" cy="108" r="27" fill="#C6703C"/><circle cx="292" cy="108" r="27" fill="#C6703C"/><circle cx="108" cy="292" r="27" fill="#C6703C"/><circle cx="292" cy="292" r="27" fill="#C6703C"/><circle cx="200" cy="200" r="33" fill="#C6703C"/></svg>
nexus · menú digital
</div>
<button class="edit-toggle" id="editToggle">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
<span id="editToggleText">Editar</span>
</button>
</header>

<div class="offline-banner" id="offlineBanner">📡 Sin conexión — mostrando la última versión guardada</div>

<main>
<h1 class="menu-title" id="localNombre">Cargando…</h1>
<p class="menu-sub" id="localSub"></p>

<div class="edit-toolbar" id="editToolbar">
<button id="btnPersonalizar">🎨 Colores</button>
</div>

<div class="cartas-panel" id="cartasPanel">
<div class="cartas-row" id="cartasRow"></div>
<div class="carta-bar" id="cartaBar"></div>
</div>

<div id="menuContent"></div>
<button class="add-plato-btn" id="addPlatoBtn">+ Añadir plato</button>
</main>

<script>
// ⚠️ Proyecto de Supabase del Menú Digital — Settings → API de ESE proyecto.
const SUPABASE_URL = 'https://cqocycltfidnberuzmun.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_2sL1kqE6FTwi_KbEtxNDvA_qTDUurza';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const params = new URLSearchParams(location.search);
const LOCAL_NOMBRE = (params.get('local') || '').trim();
const money = n => (Number(n)||0).toLocaleString('es-ES', {style:'currency', currency:'EUR'});
const DIAS_LABEL = ['D','L','M','X','J','V','S'];

const ETIQUETAS_DISPONIBLES = [
{ id:'vegano', label:'Vegano', icon:'🌱' },
{ id:'vegetariano', label:'Vegetariano', icon:'🥕' },
{ id:'sin_gluten', label:'Sin gluten', icon:'🌾' },
{ id:'picante', label:'Picante', icon:'🌶️' },
];

const TEMAS_PRESET = [
{ nombre:'Nexus (por defecto)', fondo:'#14110D', superficie:'#1C1712', superficie2:'#241E17', acento:'#C6703C', texto:'#F4EFE4', texto_dim:'#C9C2B4' },
{ nombre:'Elegante oscuro', fondo:'#0E0E12', superficie:'#181820', superficie2:'#20202A', acento:'#C9A24B', texto:'#F2F0EA', texto_dim:'#B8B6C0' },
{ nombre:'Cálido rústico', fondo:'#2B1E14', superficie:'#3A2A1C', superficie2:'#453322', acento:'#D97D3D', texto:'#F7EFE2', texto_dim:'#D4C3AE' },
{ nombre:'Claro moderno', fondo:'#FAF8F5', superficie:'#FFFFFF', superficie2:'#F0EDE7', acento:'#1F9E8C', texto:'#14110D', texto_dim:'#6B655B' },
{ nombre:'Colorido', fondo:'#1A1425', superficie:'#241C33', superficie2:'#2E2440', acento:'#E85D75', texto:'#F5F0FA', texto_dim:'#C4B8D6' },
];

let local = null;
let EDITOR_PIN = null;
let CARTAS = [];
let PLATOS = [];
let cartaViendoId = null;
let editMode = false;

// Tiempo mínimo (ms) que se ve la pantalla de bienvenida, para que el vídeo
// de animación termine de reproducirse aunque el menú cargue muy rápido.
const SPLASH_MIN_MS = 1400;
const splashStart = Date.now();
document.body.classList.add('splash-lock');

function ocultarSplash(){
const splash = document.getElementById('splash');
if (!splash || splash.classList.contains('hide')) return;
const transcurrido = Date.now() - splashStart;
const esperar = Math.max(0, SPLASH_MIN_MS - transcurrido);
setTimeout(() => {
splash.classList.add('hide');
document.body.classList.remove('splash-lock');
setTimeout(() => splash.remove(), 550);
}, esperar);
}
// Salvaguarda: si algo tarda demasiado (sin conexión, Supabase caído...) el
// splash se quita igualmente para no dejar al cliente mirando una pantalla negra.
setTimeout(ocultarSplash, 4000);

function showModal(html){
const overlay = document.createElement('div');
overlay.className = 'modal-overlay';
overlay.innerHTML = `<div class="modal-box">${html}</div>`;
document.body.appendChild(overlay);
return overlay;
}

function aplicarTema(tema){
if (!tema) return;
const root = document.documentElement.style;
if (tema.fondo) root.setProperty('--ink', tema.fondo);
if (tema.superficie) root.setProperty('--ink-soft', tema.superficie);
if (tema.superficie2) root.setProperty('--ink-softer', tema.superficie2);
if (tema.acento) root.setProperty('--rust', tema.acento);
if (tema.texto) root.setProperty('--paper', tema.texto);
if (tema.texto_dim) root.setProperty('--paper-dim', tema.texto_dim);
}

// El color de las "tarjetas" (la caja del Menú del día, los chips de carta,
// los modales…) se calcula siempre a partir del fondo elegido, en vez de
// quedarse fijo — así, si alguien pone un fondo blanco, esas cajas salen
// automáticamente en un tono claro (y no se quedan oscuras de antes),
// y si el fondo es oscuro, salen un poco más claras que él. Esto se usa
// tanto en la vista previa en vivo como al guardar los colores.
function hexARgb(hex){
hex = (hex || '').replace('#', '');
if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
const num = parseInt(hex, 16) || 0;
return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
}
function rgbAHex({ r, g, b }){
const c = v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0');
return '#' + c(r) + c(g) + c(b);
}
function derivarSuperficie(fondoHex, cantidad){
const rgb = hexARgb(fondoHex);
const luminancia = (0.299 * rgb.r + 0.587 * rgb.g + 0.114 * rgb.b) / 255;
const esClaro = luminancia > 0.5;
const delta = esClaro ? -cantidad : cantidad;
return rgbAHex({ r: rgb.r + delta, g: rgb.g + delta, b: rgb.b + delta });
}

// Si el local tiene un logo guardado (tema.logo_url), lo mostramos en vez del
// nombre en texto. Se usa tanto al cargar la página como al guardar cambios
// de personalización, para que el título esté siempre en sincronía.
function renderTitulo(){
const el = document.getElementById('localNombre');
const logoUrl = local?.tema?.logo_url;
const nombreMostrado = local?.nombre_publico || local?.nombre || '';
if (logoUrl){
el.innerHTML = `<img class="menu-logo" src="${logoUrl}" alt="${nombreMostrado}">`;
} else {
el.textContent = nombreMostrado;
}
}

async function init(){
if (!LOCAL_NOMBRE){
document.getElementById('localNombre').textContent = 'Enlace incompleto';
document.getElementById('localSub').textContent = 'Falta el nombre del local en la URL (?local=...)';
return;
}

const { data: locales } = await sb.from('locales_menu').select('id, nombre, ultima_carta_programada_id, tema, nombre_publico').ilike('nombre', LOCAL_NOMBRE.trim());
if (locales && locales.length){
local = locales[0];
renderTitulo();
aplicarTema(local.tema);
await cargarCartas();
suscribirTiempoReal();
} else {
document.getElementById('localNombre').textContent = LOCAL_NOMBRE;
document.getElementById('localSub').textContent = 'Este menú todavía no está configurado';
document.getElementById('menuContent').innerHTML = `<div class="empty">Este menú lo configura Nexus por vosotros — escribidnos y lo tenéis listo en el día.</div>`;
}
}

function dentroDeVentana(carta){
if (!carta.dias_semana || !carta.dias_semana.length || !carta.hora_inicio || !carta.hora_fin) return null;
const ahora = new Date();
const dia = ahora.getDay();
const hora = ahora.toTimeString().slice(0,8);
return carta.dias_semana.includes(dia) && hora >= carta.hora_inicio && hora <= carta.hora_fin;
}

async function cargarCartas(){
await sb.rpc('comprobar_auto_switch', { p_local_id: local.id });
const { data } = await sb.from('cartas').select('*').eq('local_id', local.id).order('created_at');
CARTAS = data || [];
if (!cartaViendoId || !CARTAS.some(c => c.id === cartaViendoId)) cartaViendoId = CARTAS[0]?.id || null;
await cargarPlatos();
}

async function cargarPlatos(){
const idsCartas = CARTAS.map(c => c.id);
if (!idsCartas.length){ PLATOS = []; render(); return; }
const { data } = await sb.from('platos').select('*').in('carta_id', idsCartas);
PLATOS = data || [];
render();
}

function render(){
renderCartasPanel();

const content = document.getElementById('menuContent');
document.getElementById('addPlatoBtn').classList.toggle('show', editMode && !!cartaViendoId);
document.getElementById('editToolbar').classList.toggle('show', editMode);

// El "Menú del día" (tipo=menu, precio fijo) siempre se muestra antes que
// las cartas normales (tipo=carta), sea cual sea el orden en que se crearon.
const puntuacionTipo = c => c.tipo === 'menu' ? 0 : 1;
const cartasAMostrar = (editMode
? CARTAS.filter(c => c.id === cartaViendoId)
: CARTAS.filter(c => c.activa)
).sort((a, b) => puntuacionTipo(a) - puntuacionTipo(b));

if (!cartasAMostrar.length){
content.innerHTML = `<div class="empty">${editMode ? 'Creá una carta arriba para empezar.' : 'La carta se está preparando.'}</div>`;
return;
}

const mostrarTitulo = !editMode && cartasAMostrar.length > 1;
content.innerHTML = cartasAMostrar.map(carta => renderCartaSeccion(carta, mostrarTitulo)).join('');

if (editMode){
content.querySelectorAll('[data-edit]').forEach(btn => btn.addEventListener('click', () => abrirFormPlato(PLATOS.find(p => p.id === btn.dataset.edit))));
content.querySelectorAll('[data-del]').forEach(btn => btn.addEventListener('click', () => borrarPlato(btn.dataset.del)));
}
}

function renderCartaSeccion(carta, mostrarTitulo){
const platosDeCarta = PLATOS.filter(p => p.carta_id === carta.id);
const esMenu = carta.tipo === 'menu';
const cuerpo = renderPlatosPorCategoria(platosDeCarta, !esMenu);
const cabecera = esMenu
? `<div class="menu-fijo-header">
<div class="menu-fijo-nombre">${carta.nombre}</div>
<div class="menu-fijo-precio">${money(carta.precio_menu)}</div>
${carta.nota_inclusion ? `<div class="menu-fijo-nota">${carta.nota_inclusion}</div>` : ''}
</div>`
: (mostrarTitulo ? `<div class="carta-seccion-title">${carta.nombre}</div>` : '');
return `<div class="carta-seccion">${cabecera}${cuerpo}</div>`;
}

function renderPlatosPorCategoria(platos, conPrecio){
if (!platos.length) return editMode ? '<div class="empty">Esta carta todavía no tiene platos.</div>' : '';
const categorias = [...new Set(platos.map(p => p.categoria))];
return categorias.map(cat => `
<div class="cat-title">${cat}</div>
${platos.filter(p => p.categoria === cat).map(p => `
<div class="plato ${!p.disponible ? 'no-disp' : ''}">
<div class="plato-info">
<div class="plato-nombre">${p.nombre}
${(p.etiquetas||[]).map(e => { const et = ETIQUETAS_DISPONIBLES.find(x=>x.id===e); return et ? `<span class="etiqueta-badge" title="${et.label}">${et.icon}</span>` : ''; }).join('')}
${!p.disponible ? '<span class="plato-tag">agotado</span>' : ''}
</div>
${p.descripcion ? `<div class="plato-desc">${p.descripcion}</div>` : ''}
</div>
${editMode ? `
<div class="plato-edit-btns">
<button class="icon-btn" data-edit="${p.id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
<button class="icon-btn danger" data-del="${p.id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg></button>
</div>` : (conPrecio ? `<div class="plato-precio">${money(p.precio)}</div>` : '')}
</div>
`).join('')}
`).join('');
}

function renderCartasPanel(){
const panel = document.getElementById('cartasPanel');
panel.classList.toggle('show', editMode);
if (!editMode) return;

const row = document.getElementById('cartasRow');
row.innerHTML = CARTAS.map(c => `
<button class="carta-chip ${c.id === cartaViendoId ? 'viendo' : ''}" data-carta="${c.id}">
${c.activa ? '<span class="dot-activa"></span>' : ''}
${c.nombre}
<span class="ico-extra">${c.tipo === 'menu' ? '🍽️' : '📋'}</span>
${c.dias_semana && c.dias_semana.length ? '<span class="ico-extra">🕒</span>' : ''}
</button>
`).join('') + `<button class="carta-chip nueva" id="btnNuevaCarta">+ Nueva</button>`;

row.querySelectorAll('[data-carta]').forEach(btn => {
btn.addEventListener('click', () => { cartaViendoId = btn.dataset.carta; render(); });
});
document.getElementById('btnNuevaCarta').addEventListener('click', () => abrirFormCarta(null));

const viendo = CARTAS.find(c => c.id === cartaViendoId);
const bar = document.getElementById('cartaBar');
if (!viendo){ bar.innerHTML = ''; return; }
const horarioTxt = (viendo.dias_semana && viendo.dias_semana.length)
? ` · se enciende sola: ${viendo.dias_semana.map(d => DIAS_LABEL[d]).join(' ')} ${viendo.hora_inicio?.slice(0,5)}-${viendo.hora_fin?.slice(0,5)}`
: '';
bar.innerHTML = `
<span>${viendo.activa ? '✓ Visible para los clientes' : 'Oculta'}${horarioTxt}</span>
<div style="display:flex; gap:8px;">
<button class="btn-toggle-carta ${viendo.activa ? 'ocultar' : 'mostrar'}" id="btnToggleActiva">${viendo.activa ? 'Ocultar' : 'Mostrar'}</button>
<button class="btn-gestionar-carta" id="btnGestionarCarta">Editar</button>
</div>`;
document.getElementById('btnToggleActiva').addEventListener('click', () => toggleCartaActiva(viendo.id, !viendo.activa));
document.getElementById('btnGestionarCarta').addEventListener('click', () => abrirFormCarta(viendo));
}

function manejarErrorPin(error){
if (error && /PIN incorrecto/i.test(error.message)){
alert('Tu sesión de edición ha caducado o el PIN ya no es válido — vuelve a tocar "Editar".');
editMode = false; EDITOR_PIN = null; updateEditToggle(); render();
return true;
}
if (error){ alert('Error: ' + error.message); return true; }
return false;
}

async function toggleCartaActiva(cartaId, activar){
const { error } = await sb.rpc('toggle_carta_activa', { p_carta_id: cartaId, p_pin: EDITOR_PIN, p_activa: activar });
if (manejarErrorPin(error)) return;
cargarCartas();
}

function abrirFormCarta(cartaExistente){
const esNueva = !cartaExistente;
const diasSel = new Set(cartaExistente?.dias_semana || []);
let tipoSel = cartaExistente?.tipo || 'carta';
const overlay = showModal(`
<h3>${esNueva ? 'Nueva carta' : 'Editar carta'}</h3>
<div class="field"><label>Nombre</label><input id="fcNombre" value="${cartaExistente?.nombre || ''}" placeholder="Ej: Menú del día"></div>
<div class="field"><label>Tipo</label>
<div class="tipo-selector" id="fcTipoSelector">
<button type="button" class="tipo-opt ${tipoSel==='carta'?'on':''}" data-tipo="carta">📋 Carta<br><span style="font-weight:400;opacity:.7;">precio por plato</span></button>
<button type="button" class="tipo-opt ${tipoSel==='menu'?'on':''}" data-tipo="menu">🍽️ Menú<br><span style="font-weight:400;opacity:.7;">precio fijo</span></button>
</div>
</div>
<div id="camposMenu" style="display:${tipoSel==='menu'?'block':'none'}">
<div class="field"><label>Precio del menú (€)</label><input id="fcPrecioMenu" type="number" step="0.01" value="${cartaExistente?.precio_menu ?? ''}" placeholder="12.50"></div>
<div class="field"><label>Qué incluye (opcional)</label><input id="fcNotaInclusion" value="${cartaExistente?.nota_inclusion || ''}" placeholder="Ej: Pan y bebida incluidos"></div>
</div>
${esNueva ? `<div class="checkbox-row"><input type="checkbox" id="fcDuplicar" ${CARTAS.length ? 'checked' : ''}><label for="fcDuplicar" style="margin:0;">Empezar con los platos de «${CARTAS.find(c=>c.id===cartaViendoId)?.nombre || ''}»</label></div>` : ''}
<p style="margin-top:10px;">Horario automático (opcional) — si no marcas ningún día, se enciende y apaga siempre a mano.</p>
<div class="dias-grid" id="fcDias">
${DIAS_LABEL.map((l,i) => `<button type="button" class="dia-toggle ${diasSel.has(i)?'on':''}" data-dia="${i}">${l}</button>`).join('')}
</div>
<div class="field-row">
<div class="field"><label>Desde</label><input type="time" id="fcHoraInicio" value="${cartaExistente?.hora_inicio?.slice(0,5) || ''}"></div>
<div class="field"><label>Hasta</label><input type="time" id="fcHoraFin" value="${cartaExistente?.hora_fin?.slice(0,5) || ''}"></div>
</div>
<button class="btn btn-primary" id="fcGuardar">Guardar</button>
${!esNueva ? `<button class="btn btn-danger" id="fcBorrar">Eliminar esta carta</button>` : ''}
<button class="btn btn-ghost" id="fcCancelar">Cancelar</button>
`);
overlay.querySelectorAll('.dia-toggle').forEach(btn => btn.addEventListener('click', () => btn.classList.toggle('on')));
overlay.querySelectorAll('.tipo-opt').forEach(btn => btn.addEventListener('click', () => {
overlay.querySelectorAll('.tipo-opt').forEach(b => b.classList.remove('on'));
btn.classList.add('on');
tipoSel = btn.dataset.tipo;
document.getElementById('camposMenu').style.display = tipoSel === 'menu' ? 'block' : 'none';
}));
document.getElementById('fcCancelar').addEventListener('click', () => overlay.remove());

if (!esNueva){
document.getElementById('fcBorrar').addEventListener('click', async () => {
if (!confirm(`¿Eliminar «${cartaExistente.nombre}» y todos sus platos?`)) return;
const { error } = await sb.rpc('borrar_carta', { p_carta_id: cartaExistente.id, p_pin: EDITOR_PIN });
if (manejarErrorPin(error)) return;
overlay.remove();
cartaViendoId = null;
cargarCartas();
});
}

document.getElementById('fcGuardar').addEventListener('click', async () => {
const nombre = document.getElementById('fcNombre').value.trim();
if (!nombre) return alert('Ponle un nombre a la carta');
const dias = [...overlay.querySelectorAll('.dia-toggle.on')].map(b => Number(b.dataset.dia));
const horaInicio = document.getElementById('fcHoraInicio').value || null;
const horaFin = document.getElementById('fcHoraFin').value || null;
const precioMenu = tipoSel === 'menu' ? parseFloat(document.getElementById('fcPrecioMenu').value || '0') : null;
const notaInclusion = tipoSel === 'menu' ? (document.getElementById('fcNotaInclusion').value.trim() || null) : null;

if (esNueva){
const { data: nuevaId, error } = await sb.rpc('crear_carta', {
p_local_id: local.id, p_pin: EDITOR_PIN, p_nombre: nombre, p_tipo: tipoSel,
p_precio_menu: precioMenu, p_nota_inclusion: notaInclusion,
p_dias_semana: dias.length ? dias : null, p_hora_inicio: horaInicio, p_hora_fin: horaFin,
});
if (manejarErrorPin(error)) return;

if (document.getElementById('fcDuplicar')?.checked && cartaViendoId){
await sb.rpc('duplicar_platos_a_carta', { p_carta_origen: cartaViendoId, p_carta_destino: nuevaId, p_pin: EDITOR_PIN });
}
overlay.remove();
cartaViendoId = nuevaId;
cargarCartas();
} else {
const { error } = await sb.rpc('editar_carta', {
p_carta_id: cartaExistente.id, p_pin: EDITOR_PIN, p_nombre: nombre, p_tipo: tipoSel,
p_precio_menu: precioMenu, p_nota_inclusion: notaInclusion,
p_dias_semana: dias.length ? dias : null, p_hora_inicio: horaInicio, p_hora_fin: horaFin,
});
if (manejarErrorPin(error)) return;
overlay.remove();
cargarCartas();
}
});
}

function abrirFormPlato(plato){
const esNuevo = !plato;
const etqSel = new Set(plato?.etiquetas || []);
const overlay = showModal(`
<h3>${esNuevo ? 'Nuevo plato' : 'Editar plato'}</h3>
<div class="field"><label>Categoría</label><input id="fCategoria" value="${plato?.categoria || ''}" placeholder="Ej: Entrantes"></div>
<div class="field"><label>Nombre</label><input id="fNombre" value="${plato?.nombre || ''}" placeholder="Ej: Ensaladilla rusa"></div>
<div class="field"><label>Descripción (opcional)</label><textarea id="fDescripcion" placeholder="Ingredientes o detalle corto">${plato?.descripcion || ''}</textarea></div>
<div class="field"><label>Precio (€) — solo se muestra si la carta es de tipo "Carta"</label><input id="fPrecio" type="number" step="0.01" value="${plato?.precio ?? ''}" placeholder="0.00"></div>
<div class="field"><label>Etiquetas</label>
<div class="etiquetas-grid">
${ETIQUETAS_DISPONIBLES.map(e => `<label class="etiqueta-check"><input type="checkbox" data-etq="${e.id}" ${etqSel.has(e.id)?'checked':''}> ${e.icon} ${e.label}</label>`).join('')}
</div>
</div>
<div class="checkbox-row"><input type="checkbox" id="fDisponible" ${plato?.disponible !== false ? 'checked' : ''}><label for="fDisponible" style="margin:0;">Disponible ahora</label></div>
<button class="btn btn-primary" id="fGuardar">Guardar</button>
<button class="btn btn-ghost" id="fCancelar">Cancelar</button>
`);
document.getElementById('fCancelar').addEventListener('click', () => overlay.remove());
document.getElementById('fGuardar').addEventListener('click', async () => {
const categoria = document.getElementById('fCategoria').value.trim() || 'General';
const nombre = document.getElementById('fNombre').value.trim();
const descripcion = document.getElementById('fDescripcion').value.trim();
const precio = parseFloat(document.getElementById('fPrecio').value || '0');
const disponible = document.getElementById('fDisponible').checked;
const etiquetas = [...overlay.querySelectorAll('[data-etq]:checked')].map(el => el.dataset.etq);
if (!nombre) return alert('Ponle un nombre al plato');
if (isNaN(precio) || precio < 0) return alert('Precio no válido');

const { error } = esNuevo
? await sb.rpc('crear_plato', { p_carta_id: cartaViendoId, p_pin: EDITOR_PIN, p_categoria: categoria, p_nombre: nombre, p_descripcion: descripcion, p_precio: precio, p_disponible: disponible, p_etiquetas: etiquetas })
: await sb.rpc('editar_plato', { p_plato_id: plato.id, p_pin: EDITOR_PIN, p_categoria: categoria, p_nombre: nombre, p_descripcion: descripcion, p_precio: precio, p_disponible: disponible, p_etiquetas: etiquetas });
if (manejarErrorPin(error)) return;
overlay.remove();
cargarPlatos();
});
}

async function borrarPlato(id){
if (!confirm('¿Quitar este plato del menú?')) return;
const { error } = await sb.rpc('borrar_plato', { p_plato_id: id, p_pin: EDITOR_PIN });
if (manejarErrorPin(error)) return;
cargarPlatos();
}

document.getElementById('addPlatoBtn').addEventListener('click', () => abrirFormPlato(null));

document.getElementById('btnPersonalizar').addEventListener('click', () => {
const t = local.tema || TEMAS_PRESET[0];
const overlay = showModal(`
<h3>Colores de tu menú</h3>
<p>Elige una plantilla, o ajusta los tuyos propios.</p>
<div class="preset-row" id="presetRow">
${TEMAS_PRESET.map((p,i) => `<button type="button" class="preset-swatch" data-i="${i}" title="${p.nombre}" style="background:${p.fondo}; box-shadow: inset 0 0 0 3px ${p.acento};"></button>`).join('')}
</div>
<div class="field"><label>Fondo</label><input type="color" id="tFondo" value="${t.fondo}"></div>
<div class="field"><label>Color de acento</label><input type="color" id="tAcento" value="${t.acento}"></div>
<div class="field"><label>Texto</label><input type="color" id="tTexto" value="${t.texto}"></div>
<div class="field"><label>Nombre a mostrar (opcional)</label><input id="tNombrePublico" value="${local.nombre_publico || ''}" placeholder="${local.nombre}"></div>
<button class="btn btn-primary" id="btnGuardarTema">Guardar</button>
<button class="btn btn-ghost" id="btnCancelarTema">Cancelar</button>
`);
const previsualizar = () => {
const fondo = document.getElementById('tFondo').value;
aplicarTema({
fondo,
superficie: derivarSuperficie(fondo, 18),
superficie2: derivarSuperficie(fondo, 30),
acento: document.getElementById('tAcento').value,
texto: document.getElementById('tTexto').value,
});
};
overlay.querySelectorAll('.preset-swatch').forEach(sw => sw.addEventListener('click', () => {
const p = TEMAS_PRESET[sw.dataset.i];
document.getElementById('tFondo').value = p.fondo;
document.getElementById('tAcento').value = p.acento;
document.getElementById('tTexto').value = p.texto;
previsualizar();
}));
['tFondo','tAcento','tTexto'].forEach(id => document.getElementById(id).addEventListener('input', previsualizar));
document.getElementById('btnCancelarTema').addEventListener('click', () => { aplicarTema(local.tema); overlay.remove(); });
document.getElementById('btnGuardarTema').addEventListener('click', async () => {
const fondoElegido = document.getElementById('tFondo').value;
const nuevoTema = {
fondo: fondoElegido,
superficie: derivarSuperficie(fondoElegido, 18),
superficie2: derivarSuperficie(fondoElegido, 30),
acento: document.getElementById('tAcento').value,
texto: document.getElementById('tTexto').value,
texto_dim: local.tema?.texto_dim || '#C9C2B4',
logo_url: local.tema?.logo_url || null,
};
const nombrePublico = document.getElementById('tNombrePublico').value.trim() || null;
const { error } = await sb.rpc('actualizar_local', { p_local_id: local.id, p_pin: EDITOR_PIN, p_tema: nuevoTema, p_nombre_publico: nombrePublico });
if (manejarErrorPin(error)) return;
local.tema = nuevoTema;
local.nombre_publico = nombrePublico;
renderTitulo();
overlay.remove();
});
});

function updateEditToggle(){
const toggle = document.getElementById('editToggle');
toggle.classList.toggle('on', editMode);
document.getElementById('editToggleText').textContent = editMode ? 'Editando' : 'Editar';
}

document.getElementById('editToggle').addEventListener('click', () => {
if (!local) return;
if (editMode){
editMode = false; EDITOR_PIN = null;
updateEditToggle();
render();
return;
}
const overlay = showModal(`
<h3>PIN del local</h3>
<p>Para editar el menú de «${LOCAL_NOMBRE}».</p>
<div class="field"><input class="pin-input" id="checkPin" inputmode="numeric" maxlength="4" placeholder="····"></div>
<button class="btn btn-primary" id="checkPinBtn">Entrar</button>
`);
document.getElementById('checkPinBtn').addEventListener('click', async () => {
const pin = document.getElementById('checkPin').value.trim();
const { data: ok } = await sb.rpc('verificar_pin_local', { p_local: LOCAL_NOMBRE, p_pin: pin });
if (!ok){ alert('PIN incorrecto'); return; }
EDITOR_PIN = pin;
overlay.remove();
editMode = true;
updateEditToggle();
render();
});
});

function suscribirTiempoReal(){
sb.channel('menu-' + local.id)
.on('postgres_changes', { event: '*', schema: 'public', table: 'platos' }, () => cargarPlatos())
.on('postgres_changes', { event: '*', schema: 'public', table: 'cartas', filter: `local_id=eq.${local.id}` }, () => cargarCartas())
.subscribe();
}

function actualizarBannerConexion(){
document.getElementById('offlineBanner').classList.toggle('show', !navigator.onLine);
}
window.addEventListener('online', actualizarBannerConexion);
window.addEventListener('offline', actualizarBannerConexion);
actualizarBannerConexion();

init();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
