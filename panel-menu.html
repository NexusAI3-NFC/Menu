<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Panel Menú Digital — Nexus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#14110D; --ink-soft:#1C1712; --ink-softer:#241E17;
    --paper:#F4EFE4; --paper-dim:#C9C2B4;
    --rust:#C6703C; --teal:#1F9E8C; --gold:#E8B93D; --bad:#D9534F;
    --slate:#9A9184; --line:rgba(244,239,228,0.10); --radius:18px;
    --mono:'JetBrains Mono',ui-monospace,monospace;
    --sans:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:var(--ink); color:var(--paper); font-family:var(--sans); -webkit-font-smoothing:antialiased; min-height:100vh; }
  a{color:inherit;} button{font:inherit; cursor:pointer;}
  h1,h2,h3{font-family:var(--mono); font-weight:800;}

  header{ position:sticky; top:0; z-index:20; background:rgba(20,17,13,.92); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); padding:16px 20px; display:flex; align-items:center; justify-content:space-between; }
  .brand{ display:flex; align-items:center; gap:9px; font-family:var(--mono); font-weight:800; font-size:15px; }
  .brand svg{ width:22px; height:22px; }
  .btn-nuevo{ font-family:var(--mono); font-size:12.5px; font-weight:700; background:var(--rust); color:var(--paper); padding:9px 15px; border-radius:20px; border:none; }

  main{ max-width:720px; margin:0 auto; padding:22px 20px 70px; }
  .search{ width:100%; background:var(--ink-soft); border:1px solid var(--line); border-radius:12px; padding:13px 15px; color:var(--paper); font-size:15px; margin-bottom:20px; }
  .stats-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:24px; }
  .stat-box{ background:var(--ink-soft); border:1px solid var(--line); border-radius:14px; padding:14px; text-align:center; }
  .stat-box .v{ font-family:var(--mono); font-weight:800; font-size:20px; }
  .stat-box .l{ font-size:10.5px; color:var(--slate); margin-top:3px; text-transform:uppercase; }

  .cliente-card{ background:var(--ink-soft); border:1px solid var(--line); border-radius:var(--radius); padding:18px; margin-bottom:14px; }
  .cliente-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:4px; }
  .cliente-nombre{ font-weight:800; font-size:16.5px; }
  .cliente-meta{ font-size:12px; color:var(--slate); margin-top:2px; }
  .cliente-contacto{ font-size:12.5px; color:var(--paper-dim); margin-top:8px; }
  .btn-add-local{ font-family:var(--mono); font-size:11px; font-weight:700; color:var(--gold); background:none; border:1px dashed var(--gold); padding:7px 11px; border-radius:16px; margin-top:12px; }

  .local-row{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    padding:11px 12px; background:var(--ink-softer); border-radius:10px; margin-top:8px;
  }
  .local-info .nombre{ font-weight:700; font-size:14px; }
  .local-info .sub{ font-size:11.5px; color:var(--slate); margin-top:2px; font-family:var(--mono); }
  .local-actions{ display:flex; gap:6px; flex-shrink:0; }
  .icon-btn{ width:32px; height:32px; border-radius:8px; display:flex; align-items:center; justify-content:center; color:var(--slate); background:var(--ink-soft); border:1px solid var(--line); }
  .icon-btn svg{ width:14px; height:14px; }
  .icon-btn.abrir{ color:var(--teal); border-color:var(--teal); }
  .icon-btn.danger{ color:var(--slate); }
  .icon-btn.danger:active{ color:var(--bad); border-color:var(--bad); }

  .empty{ text-align:center; padding:60px 20px; color:var(--slate); font-size:14px; }

  .modal-overlay{ position:fixed; inset:0; background:rgba(20,17,13,.85); backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center; z-index:100; padding:24px; }
  .modal-box{ background:var(--ink-soft); border:1px solid var(--line); border-radius:20px; padding:26px; max-width:380px; width:100%; max-height:86vh; overflow-y:auto; }
  .modal-box h3{ font-size:17px; margin-bottom:16px; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-family:var(--mono); font-size:11px; color:var(--slate); text-transform:uppercase; letter-spacing:.05em; margin-bottom:7px; }
  .field input, .field textarea{ width:100%; background:var(--ink); border:1px solid var(--line); border-radius:10px; padding:12px 13px; color:var(--paper); font-size:15px; }
  .btn{ width:100%; padding:14px; border-radius:12px; font-weight:700; font-size:14.5px; border:none; margin-top:4px; }
  .btn-primary{ background:var(--rust); color:var(--paper); }
  .btn-ghost{ background:none; border:1px solid var(--line); color:var(--paper-dim); margin-top:8px; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <svg viewBox="0 0 400 400"><rect width="400" height="400" rx="72" fill="#14110D"/><line x1="108" y1="108" x2="292" y2="292" stroke="#C6703C" stroke-width="42" stroke-linecap="round"/><line x1="292" y1="108" x2="108" y2="292" stroke="#C6703C" stroke-width="42" stroke-linecap="round"/><circle cx="108" cy="108" r="27" fill="#C6703C"/><circle cx="292" cy="108" r="27" fill="#C6703C"/><circle cx="108" cy="292" r="27" fill="#C6703C"/><circle cx="292" cy="292" r="27" fill="#C6703C"/><circle cx="200" cy="200" r="33" fill="#C6703C"/></svg>
    Panel Menú Digital
  </div>
  <button class="btn-nuevo" id="btnNuevoCliente">+ Cliente</button>
</header>

<main>
  <input class="search" id="buscador" placeholder="Buscar cliente o local…">
  <div class="stats-row">
    <div class="stat-box"><div class="v" id="totClientes">—</div><div class="l">Clientes</div></div>
    <div class="stat-box"><div class="v" id="totLocales">—</div><div class="l">Locales</div></div>
  </div>
  <div id="listaClientes"></div>
</main>

<script>
  // ⚠️ Mismo proyecto de Supabase que menu-digital.html — pega aquí la
  // misma URL y clave publishable que uses allí.
  const SUPABASE_URL = 'https://TU-PROYECTO-MENU.supabase.co';
  const SUPABASE_ANON_KEY = 'TU-CLAVE-PUBLICA-MENU';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let CLIENTES = [];
  let LOCALES = [];
  let CARTAS = [];
  let PLATOS_COUNT = {}; // carta_id -> nº de platos

  function showModal(html){
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `<div class="modal-box">${html}</div>`;
    document.body.appendChild(overlay);
    return overlay;
  }

  async function cargarTodo(){
    const [{data: clientes}, {data: locales}, {data: cartas}, {data: platos}] = await Promise.all([
      sb.from('clientes_menu').select('*').order('created_at', {ascending:false}),
      sb.from('locales_menu').select('*'),
      sb.from('cartas').select('id, local_id, activa, nombre'),
      sb.from('platos').select('id, carta_id'),
    ]);
    CLIENTES = clientes || [];
    LOCALES = locales || [];
    CARTAS = cartas || [];
    PLATOS_COUNT = {};
    (platos || []).forEach(p => { PLATOS_COUNT[p.carta_id] = (PLATOS_COUNT[p.carta_id] || 0) + 1; });
    render();
  }

  function render(){
    document.getElementById('totClientes').textContent = CLIENTES.length;
    document.getElementById('totLocales').textContent = LOCALES.length;

    const filtro = document.getElementById('buscador').value.trim().toLowerCase();
    const lista = document.getElementById('listaClientes');

    const clientesFiltrados = !filtro ? CLIENTES : CLIENTES.filter(c => {
      const localesDeEste = LOCALES.filter(l => l.cliente_id === c.id);
      return c.nombre.toLowerCase().includes(filtro) || localesDeEste.some(l => l.nombre.toLowerCase().includes(filtro));
    });

    if (!clientesFiltrados.length){
      lista.innerHTML = `<div class="empty">${CLIENTES.length ? 'Nada coincide con la búsqueda.' : 'Todavía no tenéis clientes de Menú Digital — añadid el primero arriba.'}</div>`;
      return;
    }

    lista.innerHTML = clientesFiltrados.map(c => {
      const localesDeEste = LOCALES.filter(l => l.cliente_id === c.id);
      return `
      <div class="cliente-card">
        <div class="cliente-top">
          <div>
            <div class="cliente-nombre">${c.nombre}</div>
            <div class="cliente-meta">Cliente desde ${new Date(c.fecha_alta).toLocaleDateString('es-ES')}</div>
          </div>
          <button class="icon-btn danger" data-del-cliente="${c.id}" title="Eliminar cliente">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg>
          </button>
        </div>
        ${(c.contacto_nombre || c.contacto_telefono) ? `<div class="cliente-contacto">${c.contacto_nombre || ''} ${c.contacto_telefono ? '· ' + c.contacto_telefono : ''}</div>` : ''}

        ${localesDeEste.map(l => {
          const cartasDeEste = CARTAS.filter(ca => ca.local_id === l.id);
          const activas = cartasDeEste.filter(ca => ca.activa);
          const nPlatos = activas.reduce((s, ca) => s + (PLATOS_COUNT[ca.id] || 0), 0);
          const resumenCartas = activas.length
            ? `${activas.length} carta${activas.length>1?'s':''} activa${activas.length>1?'s':''} (${activas.map(a=>a.nombre).join(', ')})`
            : 'sin cartas activas';
          return `
          <div class="local-row">
            <div class="local-info">
              <div class="nombre">${l.nombre}</div>
              <div class="sub">PIN ${l.pin} · ${resumenCartas} · ${nPlatos} platos</div>
            </div>
            <div class="local-actions">
              <a class="icon-btn abrir" href="menu-digital.html?local=${encodeURIComponent(l.nombre)}" target="_blank" title="Abrir su menú">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14L21 3"/></svg>
              </a>
              <button class="icon-btn" data-copiar="${l.nombre}" title="Copiar enlace">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7 7l1-1a5 5 0 0 0-7-7"/><path d="M14 11a5 5 0 0 0-7-7l-1 1a5 5 0 0 0 7 7"/></svg>
              </button>
              <button class="icon-btn danger" data-del-local="${l.id}" data-del-local-nombre="${l.nombre}" title="Eliminar local">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg>
              </button>
            </div>
          </div>`;
        }).join('')}

        <button class="btn-add-local" data-add-local="${c.id}">+ Nuevo local para este cliente</button>
      </div>`;
    }).join('');

    lista.querySelectorAll('[data-add-local]').forEach(btn => btn.addEventListener('click', () => abrirFormLocal(btn.dataset.addLocal)));
    lista.querySelectorAll('[data-copiar]').forEach(btn => {
      btn.addEventListener('click', () => {
        const link = `${location.href.replace(/[^/]*$/, '')}menu-digital.html?local=${encodeURIComponent(btn.dataset.copiar)}`;
        const done = () => { btn.innerHTML = '✓'; setTimeout(() => render(), 1200); };
        navigator.clipboard ? navigator.clipboard.writeText(link).then(done) : alert(link);
      });
    });
    lista.querySelectorAll('[data-del-cliente]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const cliente = CLIENTES.find(c => c.id === btn.dataset.delCliente);
        const nLocales = LOCALES.filter(l => l.cliente_id === cliente.id).length;
        const aviso = nLocales
          ? `¿Eliminar «${cliente.nombre}»? Se borran también sus ${nLocales} local(es), con todas sus cartas y platos. No se puede deshacer.`
          : `¿Eliminar «${cliente.nombre}»? No se puede deshacer.`;
        if (!confirm(aviso)) return;
        const { error } = await sb.from('clientes_menu').delete().eq('id', cliente.id);
        if (error){ alert('Error: ' + error.message); return; }
        cargarTodo();
      });
    });
    lista.querySelectorAll('[data-del-local]').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm(`¿Eliminar el local «${btn.dataset.delLocalNombre}»? Se borran también sus cartas y platos. No se puede deshacer.`)) return;
        const { error } = await sb.from('locales_menu').delete().eq('id', btn.dataset.delLocal);
        if (error){ alert('Error: ' + error.message); return; }
        cargarTodo();
      });
    });
  }

  document.getElementById('buscador').addEventListener('input', render);

  // ---------------- nuevo cliente ----------------
  document.getElementById('btnNuevoCliente').addEventListener('click', () => {
    const overlay = showModal(`
      <h3>Nuevo cliente</h3>
      <div class="field"><label>Nombre del cliente / empresa</label><input id="ncNombre" placeholder="Ej: Grupo Sabor S.L."></div>
      <div class="field"><label>Persona de contacto</label><input id="ncContacto" placeholder="Ej: Ana García"></div>
      <div class="field"><label>Teléfono</label><input id="ncTelefono" placeholder="Ej: 600 000 000"></div>
      <div class="field"><label>Email (opcional)</label><input id="ncEmail" placeholder="Ej: ana@saborsl.com"></div>
      <button class="btn btn-primary" id="ncGuardar">Crear cliente</button>
      <button class="btn btn-ghost" id="ncCancelar">Cancelar</button>
    `);
    document.getElementById('ncCancelar').addEventListener('click', () => overlay.remove());
    document.getElementById('ncGuardar').addEventListener('click', async () => {
      const nombre = document.getElementById('ncNombre').value.trim();
      if (!nombre) return alert('Ponle un nombre al cliente');
      const { error } = await sb.from('clientes_menu').insert({
        nombre,
        contacto_nombre: document.getElementById('ncContacto').value.trim() || null,
        contacto_telefono: document.getElementById('ncTelefono').value.trim() || null,
        contacto_email: document.getElementById('ncEmail').value.trim() || null,
      });
      if (error){ alert('Error: ' + error.message); return; }
      overlay.remove();
      cargarTodo();
    });
  });

  // ---------------- nuevo local ----------------
  function abrirFormLocal(clienteId){
    const overlay = showModal(`
      <h3>Nuevo local</h3>
      <div class="field"><label>Nombre del local</label><input id="nlNombre" placeholder="Ej: Sabor Centro"></div>
      <p style="font-size:12px; color:var(--slate); margin:-8px 0 14px;">Este nombre va en el enlace de la tarjeta NFC — tiene que ser único entre todos los locales.</p>
      <div class="field"><label>PIN (4 dígitos)</label><input id="nlPin" inputmode="numeric" maxlength="4" placeholder="1234"></div>
      <button class="btn btn-primary" id="nlGuardar">Crear local</button>
      <button class="btn btn-ghost" id="nlCancelar">Cancelar</button>
    `);
    document.getElementById('nlCancelar').addEventListener('click', () => overlay.remove());
    document.getElementById('nlGuardar').addEventListener('click', async () => {
      const nombre = document.getElementById('nlNombre').value.trim();
      const pin = document.getElementById('nlPin').value.trim();
      if (!nombre) return alert('Ponle un nombre al local');
      if (!/^\d{4}$/.test(pin)) return alert('El PIN debe ser de 4 dígitos');

      const { data: local, error } = await sb.from('locales_menu').insert({ cliente_id: clienteId, nombre, pin }).select('id').single();
      if (error){ alert('Error: ' + (error.message.includes('duplicate') ? 'Ya existe un local con ese nombre exacto.' : error.message)); return; }
      await sb.from('cartas').insert({ local_id: local.id, nombre: 'Principal', activa: true });
      overlay.remove();
      cargarTodo();
    });
  }

  sb.channel('panel-menu')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'clientes_menu' }, cargarTodo)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'locales_menu' }, cargarTodo)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'cartas' }, cargarTodo)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'platos' }, cargarTodo)
    .subscribe();

  cargarTodo();
</script>
</body>
</html>
